name: Release Module

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump type"
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute next version
        id: version
        run: |
          CURRENT=$(jq -r '.version' module.json)
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"
          case "${{ inputs.bump }}" in
            major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
            patch) PATCH=$((PATCH + 1)) ;;
          esac
          NEW="${MAJOR}.${MINOR}.${PATCH}"
          echo "Bumping ${CURRENT} -> ${NEW} (${{ inputs.bump }})"
          echo "current=${CURRENT}" >> "$GITHUB_OUTPUT"
          echo "new=${NEW}" >> "$GITHUB_OUTPUT"

      - name: Update module.json version
        run: |
          jq --arg v "${{ steps.version.outputs.new }}" '.version = $v' module.json > module.json.tmp
          mv module.json.tmp module.json

      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add module.json
          git commit -m "Release v${{ steps.version.outputs.new }}"
          git push origin HEAD:${{ github.ref_name }}

      - name: Build module archive
        run: |
          zip -r gluniverse-pf2e-statsblock-import.zip \
            module.json \
            scripts \
            styles \
            docs \
            README.md

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${{ steps.version.outputs.new }}" \
            module.json \
            gluniverse-pf2e-statsblock-import.zip \
            --title "v${{ steps.version.outputs.new }}" \
            --notes "Automated ${{ inputs.bump }} release. Install or update via the manifest link: https://github.com/${{ github.repository }}/releases/latest/download/module.json" \
            --target "${{ github.ref_name }}"
